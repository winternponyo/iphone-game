<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>我的手机</title>
  <link rel="stylesheet" href="style.css">
  <style>
    ::-webkit-scrollbar { display: none; }
  </style>
</head>
<body>
  <div id="phone">
    <div class="screen">
      
      <!-- 瀏海 -->
      <div id="island"></div>

      <!-- 狀態欄 -->
      <div class="status-bar">
        <span id="statusTime">5:51</span>
        <img src="icon/bar.png" alt="状态栏" style="height: 5vw; max-height: 20px; min-height: 14px; filter: invert(1); margin-bottom: 2px;">
      </div>

      <!-- 鎖屏 -->
      <div class="lock-screen" id="lockScreen">
        <div class="lock-date" id="lockDate">10月17日 星期六</div>
        <div class="lock-time">5:51</div>
        
        <div class="ios-widgets" style="display: flex; flex-direction: column; align-items: center; width: 100%; padding: 0 20px; margin-top: 10px;">
          <div style="display: flex; justify-content: center; gap: 12px; width: 100%;">
            <div style="flex: 1; background: rgba(255, 255, 255, 0.15); backdrop-filter: blur(15px); border-radius: 20px; padding: 15px 10px; text-align: center; border: 1px solid rgba(255,255,255,0.1);">
              <div style="font-size: 13px; font-weight: 500; margin-bottom: 5px; opacity: 0.9;">与 <span style="font-weight: bold; color: #87CEFA;">yymm</span> 同行的第</div>
              <div style="font-size: 22px; font-weight: bold; margin-bottom: 2px;"><span id="togetherDays">991</span> 天</div>
            </div>
            <div style="flex: 1; background: rgba(255, 255, 255, 0.15); backdrop-filter: blur(15px); border-radius: 20px; padding: 15px 10px; text-align: center; border: 1px solid rgba(255,255,255,0.1); display: flex; flex-direction: column; justify-content: center; align-items: center;">
              <div style="font-size: 15px; font-weight: 500; margin-bottom: 8px; opacity: 0.9;">向前向上向圆满</div>
              <div style="display: flex; justify-content: center; align-items: center; gap: 6px; width: 100%;">
                <span style="opacity: 0.85; font-weight: 600; font-size: 15px;">Abby</span>
                <div style="flex: 1; display: flex; align-items: center; max-width: 40px;">
                  <div style="flex: 1; height: 1px; border-bottom: 1px dashed rgba(255,255,255,0.5);"></div>
                  <span style="font-size: 10px; color: #ff3b30; margin: 0 2px;">❤️</span>
                  <div style="flex: 1; height: 1px; border-bottom: 1px dashed rgba(255,255,255,0.5);"></div>
                </div>
                <span style="opacity: 0.85; font-weight: 600; font-size: 15px;">Eric</span>
              </div>
            </div>
          </div>
        </div>

        <div class="lock-bottom">
          <div class="lock-circle">
            <img src="icon/lockflashlight.png" style="width: 26px; height: 26px; filter: invert(1);">
          </div>
          <div class="swipe-hint" onclick="showPasscode()" style="cursor: pointer; padding: 8px 16px; background: rgba(255,255,255,0.15); border-radius: 20px;">点击解锁</div>
          <div class="lock-circle">
            <img src="icon/lockcamera.png" style="width: 32px; height: 32px; filter: invert(1);">
          </div>
        </div>
      </div>

      <!-- 主屏幕 -->
      <div class="home-screen" id="homeScreen">
        
        <div class="home-content">
          
          <!-- 天氣 Widget -->
          <div style="background: rgba(255, 255, 255, 0.15); backdrop-filter: blur(20px); border-radius: 20px; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; color: #fff; margin-bottom: 12px; height: 75px; box-sizing: border-box;">
            <div>
              <div style="font-size: 12px; opacity: 0.8;">北京</div>
              <div style="font-size: 24px; font-weight: 300;">18°</div>
            </div>
            <div style="font-size: 20px; opacity: 0.9; margin: 0 15px;">ᯓᰔ</div>
            <div style="text-align: right;">
              <div style="font-size: 14px; font-weight: bold;">圆圆满满</div>
              <div style="font-size: 11px; opacity: 0.8;">陪伴第 <span id="togetherDaysHome">991</span> 天</div>
            </div>
          </div>

          <!-- 相簿 Widget -->
          <div onclick="openApp('相册')" style="background: linear-gradient(135deg, #a1c4fd 0%, #c2e9fb 100%); border-radius: 20px; padding: 15px; cursor: pointer; margin-bottom: 20px;">
            <div style="font-size: 14px; font-weight: bold; color: #fff; margin-bottom: 10px; display: flex; justify-content: space-between;">
              <span>圆圆满满的回忆</span><span>˗ˋˏ ♡ ˎˊ˗</span>
            </div>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
              <div style="background: rgba(255,255,255,0.3); border-radius: 10px; height: 60px; display: flex; align-items: center; justify-content: center; font-size: 24px;">🏓</div>
              <div style="background: rgba(255,255,255,0.3); border-radius: 10px; height: 60px; display: flex; align-items: center; justify-content: center; font-size: 24px;">🏆</div>
            </div>
          </div>

          <!-- App 圖標區塊 -->
          <div class="app-grid">
            <div class="app" onclick="openApp('相册')"><div class="app-icon"><img src="icon/photos.png"></div><span>相册</span></div>
            <div class="app" onclick="openApp('天气')"><div class="app-icon"><img src="icon/weather.png"></div><span>天气</span></div>
            <div class="app" onclick="openApp('备忘录')"><div class="app-icon"><img src="icon/notes.png"></div><span>备忘录</span></div>
            <div class="app" onclick="openApp('设置')"><div class="app-icon" style="background: transparent; box-shadow: none;"><img src="icon/settings.png" style="width:110%; height:110%;"></div><span>设置</span></div>
            
            <div class="app" onclick="openWeChat()"><div class="app-icon"><img src="icon/wechat.png"></div><span>微信</span></div>
            <div class="app" onclick="openApp('instagram')"><div class="app-icon"><img src="icon/instagram.png"></div><span>Instagram</span></div>
            <div class="app" onclick="openWeibo()"><div class="app-icon"><img src="icon/weibo.png"></div><span>微博</span></div>
            <div class="app" onclick="openXianyu()"><div class="app-icon"><img src="icon/xianyu.png"></div><span>闲鱼</span></div>
            
            <div class="app" onclick="openCountdown()"><div class="app-icon" style="background: #ff3b30; color: white; display:flex; align-items:center; justify-content:center; font-size:26px; border-radius: 15px;">⏳</div><span>倒数日</span></div>
            <div class="app" onclick="openMusic()"><div class="app-icon" style="background: #ff2d55; color: white; display:flex; align-items:center; justify-content:center; font-size:26px; border-radius: 15px;">🎵</div><span>音乐</span></div>
            <div class="app" onclick="openCalculator()"><div class="app-icon" style="background: #333; color: white; display:flex; align-items:center; justify-content:center; font-size:26px; border-radius: 15px;">🧮</div><span>计算器</span></div>
            <div class="app" onclick="openCalendar()"><div class="app-icon" style="background: white; color: #ff3b30; display:flex; align-items:center; justify-content:center; font-size:24px; font-weight:bold; border-radius: 15px;">17</div><span>日历</span></div>
          </div>

        </div>

        <!-- 搜索掣 (絕對釘死喺 Dock 上面，唔會重疊) -->
        <div class="spot">🔍 搜索</div>

        <!-- 底部 Dock -->
        <div class="dock">
          <div class="app" onclick="openApp('电话')"><div class="app-icon"><img src="icon/phone.png" style="width:110%; height:110%;"></div><span>电话</span></div>
          <div class="app" onclick="openApp('Safari')"><div class="app-icon"><img src="icon/safari.png"></div><span>Safari</span></div>
        </div>
      </div>

      <!-- 密碼解鎖畫面 -->
      <div class="passcode-screen" id="passcodeScreen">
        <div class="passcode-title">输入密码</div>
        <div class="passcode-dots">
          <div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div>
        </div>
        <div class="keypad">
          <div class="key" onclick="enterPass('1')">1</div><div class="key" onclick="enterPass('2')">2<span>ABC</span></div><div class="key" onclick="enterPass('3')">3<span>DEF</span></div>
          <div class="key" onclick="enterPass('4')">4<span>GHI</span></div><div class="key" onclick="enterPass('5')">5<span>JKL</span></div><div class="key" onclick="enterPass('6')">6<span>MNO</span></div>
          <div class="key" onclick="enterPass('7')">7<span>PQRS</span></div><div class="key" onclick="enterPass('8')">8<span>TUV</span></div><div class="key" onclick="enterPass('9')">9<span>WXYZ</span></div>
          <div class="key blank"></div><div class="key" onclick="enterPass('0')">0</div><div class="key blank"></div>
        </div>
        <div class="passcode-bottom">
          <div class="passcode-btn">紧急情况</div>
          <div class="passcode-btn" onclick="cancelPasscode()">取消</div>
        </div>
      </div>

      <!-- App 弹层 -->
      <div class="app-view" id="appView">
        <div class="app-header">
          <button onclick="closeApp()">← 返回</button>
          <span id="appTitle"></span>
        </div>
        <div class="app-content" id="appContent"></div>
      </div>

      <!-- 底部 Home 橫條 -->
      <div style="position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%); width: 130px; height: 5px; background: #fff; border-radius: 10px; z-index: 100; pointer-events: none;"></div>

    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
