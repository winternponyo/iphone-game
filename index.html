<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>我的手机</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="phone">
    <div class="screen">
      
      <!-- 狀態欄 -->
      <div class="status-bar">
        <span id="statusTime">5:51</span>
        <img src="icon/bar.png" alt="状态栏" style="height: 20px; filter: invert(1); margin-bottom: 2px;">
      </div>

      <!-- 鎖屏 -->
      <div class="lock-screen" id="lockScreen">
        <!-- 頂部日期 -->
        <div class="lock-date" id="lockDate">10月17日 星期六</div>
        
        <!-- 中間超大時間 -->
        <div class="lock-time">5:51</div>
        
        <!-- 鎖屏 Widgets -->
        <div class="ios-widgets">
          <div class="widget-left">
            <div class="w-temp"><img src="icon/emoji/sun.png" style="width:16px; vertical-align:middle; filter:invert(1);"> 18°</div>
            <div class="w-desc">多云</div>
            <div class="w-highlow">最高21° 最低12°</div>
          </div>
          <div class="widget-center">
            <div class="w-cal-days"><span>2</span><span></span><span>3</span></div>
            <div class="w-cal-nums"><span>09</span><span style="color:#ff3b30; font-size:16px;">❤️</span><span>19</span></div>
          </div>         
          <div class="widget-right">
            <div class="battery-ring"><div class="battery-inner"></div></div>
          </div>
        </div>

        <!-- 解謎提示 -->
        <div class="lock-hint">
          <img src="icon/notes.png" style="width: 16px; height: 16px; border-radius: 4px;">
          <span>我的生日 + 小昱的生日</span>
        </div>

        <!-- 底部手電筒同相機 -->
        <div class="lock-bottom">
          <div class="lock-circle">
            <img src="icon/lockflashlight.png" style="width: 26px; height: 26px; filter: invert(1);">
          </div>
          <div class="swipe-hint">向上轻扫以打开</div>
          <div class="lock-circle">
            <img src="icon/lockcamera.png" style="width: 32px; height: 32px; filter: invert(1);">
          </div>
        </div>
      </div>

      <!-- 主屏幕 -->
      <div class="home-screen" id="homeScreen">
        <div class="widget">
          <div class="widget-city">首尔</div>
          <div class="widget-temp">18°</div>
          <div class="widget-desc">大部晴朗 · 最高21° 最低12°</div>
        </div>
        
        <div class="app-grid">
          <div class="app" onclick="openApp('相册')">
            <div class="app-icon"><img src="icon/photos.png" alt="相册"></div>
            <span>相册</span>
          </div>
          <div class="app" onclick="openApp('天气')">
            <div class="app-icon"><img src="icon/weather.png" alt="天气"></div>
            <span>天气</span>
          </div>
          <div class="app" onclick="openApp('备忘录')">
            <div class="app-icon"><img src="icon/notes.png" alt="备忘录"></div>
            <span>备忘录</span>
          </div>
          <div class="app" onclick="openApp('设置')">
            <div class="app-icon" style="background: transparent; box-shadow: none;">
              <img src="icon/settings.png" alt="设置" style="width:110%; height:110%;">
            </div>
            <span>设置</span>
          </div>
          <div class="app" onclick="openWeChat()">
            <div class="app-icon"><img src="icon/wechat.png" alt="WeChat"></div>
            <span>WeChat</span>
          </div>
        </div>

        <div class="dock">
          <div class="app" onclick="openApp('电话')">
            <div class="app-icon"><img src="icon/phone.png" alt="电话" style="width:110%; height:110%;"></div>
            <span>电话</span>
          </div>
          <div class="app" onclick="openApp('Safari')">
            <div class="app-icon"><img src="icon/safari.png" alt="Safari"></div>
            <span>Safari</span>
          </div>
          <div class="app" onclick="openApp('音乐')">
            <div class="app-icon"><img src="icon/music.png" alt="音乐"></div>
            <span>音乐</span>
          </div>
        </div>
      </div>

      <!-- 密碼解鎖畫面 -->
      <div class="passcode-screen" id="passcodeScreen">
        <div class="passcode-title">輸入密碼</div>
        <div class="passcode-dots">
          <div class="dot"></div><div class="dot"></div>
          <div class="dot"></div><div class="dot"></div>
        </div>
        <div class="keypad">
          <div class="key" onclick="enterPass('1')">1</div>
          <div class="key" onclick="enterPass('2')">2</div>
          <div class="key" onclick="enterPass('3')">3</div>
          <div class="key" onclick="enterPass('4')">4</div>
          <div class="key" onclick="enterPass('5')">5</div>
          <div class="key" onclick="enterPass('6')">6</div>
          <div class="key" onclick="enterPass('7')">7</div>
          <div class="key" onclick="enterPass('8')">8</div>
          <div class="key" onclick="enterPass('9')">9</div>
          <div class="key empty"></div>
          <div class="key" onclick="enterPass('0')">0</div>
          <div class="key" onclick="deletePass()">⌫</div>
        </div>
      </div>

      <!-- App 弹层 -->
      <div class="app-view" id="appView">
        <div class="app-header">
          <button onclick="closeApp()">← 返回</button>
          <span id="appTitle"></span>
        </div>
        <div class="app-content" id="appContent"></div>
      </div>

      <!-- 控制中心 -->
      <div class="control-center" id="controlCenter">
        <div class="cc-panel">
          <div class="cc-box cc-grid-2x2">
            <div style="display:flex; align-items:center; gap:10px;"><div style="width:40px; height:40px; border-radius:50%; background:#007aff; display:flex; align-items:center; justify-content:center; font-size:20px;">✈️</div> 飞行模式</div>
            <div style="display:flex; align-items:center; gap:10px;"><div style="width:40px; height:40px; border-radius:50%; background:#34c759; display:flex; align-items:center; justify-content:center; font-size:20px;">📶</div> 蜂窝网络</div>
            <div style="display:flex; align-items:center; gap:10px;"><div style="width:40px; height:40px; border-radius:50%; background:#007aff; display:flex; align-items:center; justify-content:center; font-size:20px;">📡</div> Wi-Fi</div>
            <div style="display:flex; align-items:center; gap:10px;"><div style="width:40px; height:40px; border-radius:50%; background:#007aff; display:flex; align-items:center; justify-content:center; font-size:20px;">📻</div> 蓝牙</div>
          </div>
          <div class="cc-box" style="grid-column: span 2; padding: 16px;">
            <div style="font-size:13px; color:#888; margin-bottom:5px;">正在播放</div>
            <div style="font-size:16px; font-weight:600; margin-bottom:10px;">暂无音乐</div>
            <div style="display:flex; justify-content:space-between; font-size:24px; color:#333; margin-top:20px;">
              <span>⏮</span><span>▶️</span><span>⏭</span>
            </div>
          </div>
          <div class="cc-box cc-grid-1x2" style="grid-column: span 4; display:flex; gap:15px; padding:15px;">
            <div style="flex:1; background:rgba(0,0,0,0.05); border-radius:10px; height:120px; display:flex; align-items:flex-end; padding-bottom:10px; justify-content:center; font-size:24px;">☀️</div>
            <div style="flex:1; background:rgba(0,0,0,0.05); border-radius:10px; height:120px; display:flex; align-items:flex-end; padding-bottom:10px; justify-content:center; font-size:24px;">🔊</div>
          </div>
          <div class="cc-box cc-grid-1x4" style="grid-column: span 4; display:flex; justify-content:space-between; padding:15px; font-size:24px;">
            <div style="width:50px; height:50px; background:rgba(0,0,0,0.05); border-radius:50%; display:flex; align-items:center; justify-content:center;">🔦</div>
            <div style="width:50px; height:50px; background:rgba(0,0,0,0.05); border-radius:50%; display:flex; align-items:center; justify-content:center;">⏱️</div>
            <div style="width:50px; height:50px; background:rgba(0,0,0,0.05); border-radius:50%; display:flex; align-items:center; justify-content:center;">🧮</div>
            <div style="width:50px; height:50px; background:rgba(0,0,0,0.05); border-radius:50%; display:flex; align-items:center; justify-content:center;">📷</div>
          </div>
        </div>
      </div>

    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
