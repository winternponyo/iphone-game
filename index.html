<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的手机</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="phone">
    <div class="screen">
      
      <div class="status-bar">
        <span id="statusTime">5:51</span>
        <img src="icon/bar.png" alt="状态栏" style="height: 20px; filter: invert(1); margin-bottom: 2px;">
      </div>

      <!-- 锁屏 -->
      <div class="lock-screen" id="lockScreen">
        <div class="lock-date">10月17日 星期六</div>
        <div class="lock-time">5:51</div>
        <div class="lock-bottom">
          <div class="lock-circle">
            <img src="icon/lockflashlight.png" alt="手电筒" style="width: 26px; height: 26px; filter: invert(1);">
          </div>
          <div class="swipe-hint">向上轻扫以打开</div>
          <div class="lock-circle">
            <img src="icon/lockcamera.png" alt="相机" style="width: 32px; height: 32px; filter: invert(1);">
          </div>
        </div>
        </div>
      </div>

      <!-- 主屏幕 -->
      <div class="home-screen" id="homeScreen">
        <div class="widget">
          <div class="widget-city">首尔</div>
          <div class="widget-temp">18°</div>
          <div class="widget-desc">大部晴朗 · 最高21° 最低12°</div>
        </div>
        
        <!-- 桌面 App 图标 -->
        <div class="app-grid">
          <!-- 相册 -->
          <div class="app" onclick="openApp('相册')">
            <div class="app-icon">
              <img src="icon/photos.png" alt="相册" style="width:100%; height:100%; object-fit:cover; border-radius: 15px;">
            </div>
            <span>相册</span>
          </div>

          <!-- 天气 -->
          <div class="app" onclick="openApp('天气')">
            <div class="app-icon">
              <img src="icon/weather.png" alt="天气" style="width:100%; height:100%; object-fit:cover; border-radius: 15px;">
            </div>
            <span>天气</span>
          </div>

          <!-- 备忘录 -->
          <div class="app" onclick="openApp('备忘录')">
            <div class="app-icon">
              <img src="icon/notes.png" alt="备忘录" style="width:100%; height:100%; object-fit:cover; border-radius: 15px;">
            </div>
            <span>备忘录</span>
          </div>

          <!-- 设置 (特别版) -->
          <div class="app" onclick="openApp('设置')">
            <div class="app-icon" style="background: transparent; box-shadow: none;">
              <img src="icon/settings.png" alt="设置" style="width:110%; height:110%; object-fit:cover; border-radius: 15px;">
            </div>
            <span>设置</span>
          </div>
        </div>
        <!-- 底部 Dock -->
        <div class="dock">
          <div class="app" onclick="openApp('电话')">
            <img src="icon/phone.png" alt="电话" style="width:115%; height:115%; object-fit:cover; border-radius: 15px; margin: -7%;">
            <span>电话</span>
          </div>
          <div class="app" onclick="openApp('Safari')">
            <div class="app-icon"><img src="icon/safari.png" alt="Safari" style="width:100%; height:100%; object-fit:cover; border-radius: 15px;"></div>
            <span>Safari</span>
          </div>
          <div class="app" onclick="openApp('音乐')">
            <div class="app-icon"><img src="icon/music.png" alt="音乐" style="width:100%; height:100%; object-fit:cover; border-radius: 15px;"></div>
            <span>音乐</span>
          </div>
        </div>
      </div>

      <!-- 通知 (已經搬出 app-view 外面) -->
      <div class="notification" id="notification">
        <img src="icon/notes.png" alt="备忘录" style="width:36px; height:36px; object-fit:cover; border-radius:8px;">
        <div class="notif-body">
          <div class="notif-title">备忘录</div>
          <div class="notif-text">
            她的生日 <img src="icon/emoji/cake.png" alt="蛋糕" style="width: 16px; height: 16px; vertical-align: middle; margin: 0 2px;"> 11月21日 · 35天后
          </div>
        </div>
      </div>

      <!-- 密碼解鎖畫面 -->
      <div class="passcode-screen" id="passcodeScreen">
        <div class="passcode-title">輸入密碼</div>
        <div class="passcode-dots">
          <div class="dot"></div><div class="dot"></div>
          <div class="dot"></div><div class="dot"></div>
        </div>
        <div class="keypad">
          <div class="key" onclick="enterPass('1')">1</div>
          <div class="key" onclick="enterPass('2')">2</div>
          <div class="key" onclick="enterPass('3')">3</div>
          <div class="key" onclick="enterPass('4')">4</div>
          <div class="key" onclick="enterPass('5')">5</div>
          <div class="key" onclick="enterPass('6')">6</div>
          <div class="key" onclick="enterPass('7')">7</div>
          <div class="key" onclick="enterPass('8')">8</div>
          <div class="key" onclick="enterPass('9')">9</div>
          <div class="key empty"></div>
          <div class="key" onclick="enterPass('0')">0</div>
          <div class="key" onclick="deletePass()">⌫</div>
        </div>
      </div>

      <!-- App 弹层 -->
      <div class="app-view" id="appView">
        <div class="app-header">
          <button onclick="closeApp()">← 返回</button>
          <span id="appTitle"></span>
        </div>
        <div class="app-content" id="appContent"></div>
      </div>

    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
