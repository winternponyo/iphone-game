<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>我的手机</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="phone">
    <div class="screen">
      
      <!-- 狀態欄 -->
      <div class="status-bar">
        <span id="statusTime">5:51</span>
        <img src="icon/bar.png" alt="状态栏" style="height: 20px; filter: invert(1); margin-bottom: 2px;">
      </div>

      <!-- 鎖屏 -->
      <div class="lock-screen" id="lockScreen">
        <div class="lock-date" id="lockDate">10月17日 星期六</div>
        <div class="lock-time">5:51</div>
        
        <!-- 鎖屏 Widgets (極簡透明風 - CP版) -->
        <div class="ios-widgets" style="display: flex; flex-direction: column; align-items: center; width: 100%; padding: 0 20px; margin-top: 10px;">
          
          <div style="display: flex; justify-content: center; gap: 12px; width: 100%;">
            
            <!-- 左邊卡片：同行天數 -->
            <div style="flex: 1; background: rgba(255, 255, 255, 0.15); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px); border-radius: 20px; padding: 15px 10px; text-align: center; border: 1px solid rgba(255,255,255,0.1); box-shadow: 0 4px 15px rgba(0,0,0,0.1); display: flex; flex-direction: column; justify-content: center;">
              <div style="font-size: 13px; font-weight: 500; margin-bottom: 5px; opacity: 0.9;">
                與 <span style="font-weight: bold; color: #87CEFA;">yymm</span> 同行的第
              </div>
              <div style="font-size: 22px; font-weight: bold; margin-bottom: 2px;">
                <span id="togetherDays">991</span> 天
              </div>
            </div>

            <!-- 右邊卡片：CP 專屬口號 -->
            <div style="flex: 1; background: rgba(255, 255, 255, 0.15); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px); border-radius: 20px; padding: 15px 10px; text-align: center; border: 1px solid rgba(255,255,255,0.1); box-shadow: 0 4px 15px rgba(0,0,0,0.1); display: flex; flex-direction: column; justify-content: center; align-items: center;">
              <div style="font-size: 12px; font-weight: 500; margin-bottom: 8px; opacity: 0.9;">向前向上向圆满</div>
              
              <!-- 兩人名字縮寫 + 心心連線 -->
              <div style="display: flex; justify-content: center; align-items: center; gap: 6px; font-size: 11px; font-weight: 600; width: 100%;">
                <span style="opacity: 0.85;">ABBY</span>
                <div style="flex: 1; display: flex; align-items: center; max-width: 40px;">
                  <div style="flex: 1; height: 1px; border-bottom: 1px dashed rgba(255,255,255,0.5);"></div>
                  <span style="font-size: 10px; color: #ff3b30; margin: 0 2px;">❤️</span>
                  <div style="flex: 1; height: 1px; border-bottom: 1px dashed rgba(255,255,255,0.5);"></div>
                </div>
                <span style="opacity: 0.85;">ERIC</span>
              </div>
            </div>

          </div>

        </div>
	
        <!-- 底部按鈕 -->
        <div class="lock-bottom">
          <div class="lock-circle">
            <img src="icon/lockflashlight.png" style="width: 26px; height: 26px; filter: invert(1);">
          </div>
          <div class="swipe-hint" onclick="showPasscode()" style="cursor: pointer; padding: 8px 16px; background: rgba(255,255,255,0.15); border-radius: 20px;">
            點擊解鎖
          </div>
          <div class="lock-circle">
            <img src="icon/lockcamera.png" style="width: 32px; height: 32px; filter: invert(1);">
          </div>
        </div>
      </div>

      <!-- 主屏幕 -->
      <div class="home-screen" id="homeScreen" style="transition: filter 0.3s ease, transform 0.3s ease;">
        <div class="widget">
          <div class="widget-city">首尔</div>
          <div class="widget-temp">18°</div>
          <div class="widget-desc">大部晴朗 · 最高21° 最低12°</div>
        </div>
        
        <!-- 👇 所有 App 圖標都喺呢個網格入面 -->
        <div class="app-grid">
          <div class="app" onclick="openApp('相册')">
            <div class="app-icon"><img src="icon/photos.png" alt="相册"></div>
            <span>相册</span>
          </div>
          <div class="app" onclick="openApp('天气')">
            <div class="app-icon"><img src="icon/weather.png" alt="天气"></div>
            <span>天气</span>
          </div>
          <div class="app" onclick="openApp('备忘录')">
            <div class="app-icon"><img src="icon/notes.png" alt="备忘录"></div>
            <span>备忘录</span>
          </div>
          <div class="app" onclick="openApp('设置')">
            <div class="app-icon" style="background: transparent; box-shadow: none;">
              <img src="icon/settings.png" alt="设置" style="width:110%; height:110%;">
            </div>
            <span>设置</span>
          </div>
          <div class="app" onclick="openWeChat()">
            <div class="app-icon"><img src="icon/wechat.png" alt="WeChat"></div>
            <span>微信</span>
          </div>
          <div class="app" onclick="openApp('instagram')">
            <div class="app-icon">
              <img src="icon/instagram.png" alt="Instagram" style="width:100%; height:100%; object-fit:cover; border-radius: 15px;">
            </div>
            <span>Instagram</span>
          </div>
          <!-- 微博圖標 (搬返入網格) -->
          <div class="app" onclick="openWeibo()">
            <div class="app-icon">
              <img src="icon/weibo.png" alt="微博" style="width:100%; height:100%; object-fit:cover; border-radius: 15px;">
            </div>
            <span>微博</span>
          </div>
        </div>

        <!-- 底部 Dock -->
        <div class="dock">
          <div class="app" onclick="openApp('电话')">
            <div class="app-icon"><img src="icon/phone.png" alt="电话" style="width:110%; height:110%;"></div>
            <span>电话</span>
          </div>
          <div class="app" onclick="openApp('Safari')">
            <div class="app-icon"><img src="icon/safari.png" alt="Safari"></div>
            <span>Safari</span>
          </div>
          <div class="app" onclick="openApp('音乐')">
            <div class="app-icon"><img src="icon/music.png" alt="音乐"></div>
            <span>音乐</span>
          </div>
        </div>
      </div>

      <!-- 密碼解鎖畫面 -->
      <div class="passcode-screen" id="passcodeScreen">
        <div class="passcode-title">輸入密碼</div>
        <div class="passcode-dots">
          <div class="dot"></div><div class="dot"></div>
          <div class="dot"></div><div class="dot"></div>
        </div>
        <div class="keypad">
          <div class="key" onclick="enterPass('1')">1<span> </span></div>
          <div class="key" onclick="enterPass('2')">2<span>ABC</span></div>
          <div class="key" onclick="enterPass('3')">3<span>DEF</span></div>
          <div class="key" onclick="enterPass('4')">4<span>GHI</span></div>
          <div class="key" onclick="enterPass('5')">5<span>JKL</span></div>
          <div class="key" onclick="enterPass('6')">6<span>MNO</span></div>
          <div class="key" onclick="enterPass('7')">7<span>PQRS</span></div>
          <div class="key" onclick="enterPass('8')">8<span>TUV</span></div>
          <div class="key" onclick="enterPass('9')">9<span>WXYZ</span></div>
          <div class="key blank"></div>
          <div class="key" onclick="enterPass('0')">0<span> </span></div>
          <div class="key blank"></div>
        </div>
        
        <div class="passcode-bottom">
          <div class="passcode-btn">緊急情況</div>
          <div class="passcode-btn" onclick="cancelPasscode()">取消</div>
        </div>
      </div>

      <!-- App 弹层 -->
      <div class="app-view" id="appView">
        <div class="app-header">
          <button onclick="closeApp()">← 返回</button>
          <span id="appTitle"></span>
        </div>
        <div class="app-content" id="appContent"></div>
      </div>

      <!-- Instagram 視像通話畫面 -->
      <div class="ig-call-screen" id="igCallScreen">
        <div class="ig-call-bg"></div>
        <div class="ig-call-top">
          <div class="ig-call-avatar">😸</div>
          <div class="ig-call-name">小昱</div>
          <div class="ig-call-status">Instagram 视频通话...</div>
        </div>
        <div class="ig-call-bottom">
          <div class="ig-btn red" onclick="endIgCall()">📞</div>
        </div>
      </div>

      <!-- Apple Music 播放器 -->
      <div class="am-player" id="amPlayer">
        <div class="am-header">
          <button onclick="closeMusic()">⌄</button>
          <div>正在播放</div>
          <div style="width:20px;"></div>
        </div>
        <div class="am-cover">🎵</div>
        <div class="am-info">
          <div class="am-title">告白气球</div>
          <div class="am-artist">周杰伦</div>
        </div>
        <div class="am-progress-container">
          <div class="am-progress-bar">
            <div class="am-progress" id="amProgress"></div>
          </div>
          <div class="am-time">
            <span>0:00</span>
            <span>3:35</span>
          </div>
        </div>
        <div class="am-controls">
          <div class="am-btn">⏮</div>
          <div class="am-btn play" onclick="togglePlay()" id="amPlayBtn">▶️</div>
          <div class="am-btn">⏭</div>
        </div>
      </div>

      <!-- 控制中心 -->
      <div class="control-center" id="controlCenter">
        <div class="cc-panel">
          <div class="cc-box cc-grid-2x2">
            <div style="display:flex; align-items:center; gap:10px;"><div style="width:40px; height:40px; border-radius:50%; background:#007aff; display:flex; align-items:center; justify-content:center; font-size:20px;">✈️</div> 飞行模式</div>
            <div style="display:flex; align-items:center; gap:10px;"><div style="width:40px; height:40px; border-radius:50%; background:#34c759; display:flex; align-items:center; justify-content:center; font-size:20px;">📶</div> 蜂窝网络</div>
            <div style="display:flex; align-items:center; gap:10px;"><div style="width:40px; height:40px; border-radius:50%; background:#007aff; display:flex; align-items:center; justify-content:center; font-size:20px;">📡</div> Wi-Fi</div>
            <div style="display:flex; align-items:center; gap:10px;"><div style="width:40px; height:40px; border-radius:50%; background:#007aff; display:flex; align-items:center; justify-content:center; font-size:20px;">📻</div> 蓝牙</div>
          </div>
        </div>
      </div>

      <!-- 底部 Home 橫條 -->
      <div style="position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%); width: 130px; height: 5px; background: #fff; border-radius: 10px; z-index: 100; pointer-events: none;"></div>

    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
